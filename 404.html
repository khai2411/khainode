<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan | Khai</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                fontFamily: {
                    sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    display: ['"Space Grotesk"', 'sans-serif'],
                },
                extend: { colors: { primary: '#0ea5e9', secondary: '#38bdf8' } }
            }
        }
    </script>
</head>
<body class="bg-[#f0f9ff] dark:bg-[#06090e] text-slate-800 dark:text-slate-200 min-h-screen flex items-center justify-center px-6">
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <div class="text-center max-w-md">
        <p class="font-display text-8xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary mb-4">404</p>
        <h1 class="font-display text-2xl md:text-3xl font-bold mb-3">Halaman tidak ditemukan</h1>
        <p class="text-slate-500 dark:text-slate-400 mb-8">Sepertinya halaman yang kamu cari sudah dipindahkan atau tidak pernah ada.</p>
        <a href="/" class="inline-block px-8 py-3.5 bg-slate-900 dark:bg-white text-white dark:text-black rounded-full font-bold hover:scale-[1.02] transition-transform">
            Kembali ke Beranda
        </a>
    </div>
</body>
</html>
